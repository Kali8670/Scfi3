<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Control</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin: 10px 0; }
    input { padding: 10px; font-size: 16px; width: 70%; margin: 10px 0; }
    button { padding: 12px 20px; font-size: 16px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 6px; }
    .status { color: #00ffcc; font-size: 20px; margin-top: 15px; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h2>📱 Remote Controller App</h2>

  <div id="loginSection" class="card">
    <h3>Enter Room ID (e.g. 100)</h3>
    <input type="number" id="roomInput" value="100">
    <br>
    <button onclick="joinRoom('controller')">Phone 1 (Controller)</button>
    <button onclick="joinRoom('target')">Phone 2 (Target Device)</button>
  </div>

  <div id="controllerUI" class="card hidden">
    <h3>[ Phone 1 - Controller ]</h3>
    <button onclick="sendAction('HOME_CLICK')">🏠 Home</button>
    <button onclick="sendAction('SWIPE_UP')">⬆️ Swipe Up</button>
    <div class="status" id="controllerLog">Ready to send!</div>
  </div>

  <div id="targetUI" class="card hidden">
    <h3>[ Phone 2 - Target ]</h3>
    <div class="status" id="targetLog">Waiting for commands...</div>
  </div>

  <script>
    const socket = io();
    let currentRoom = "";
    let myRole = "";

    function joinRoom(role) {
      currentRoom = document.getElementById('roomInput').value;
      myRole = role;
      if (!currentRoom) { alert("Enter Room ID!"); return; }

      socket.emit('join-room', { room: currentRoom, role: role });

      document.getElementById('loginSection').classList.add('hidden');
      if (role === 'controller') {
        document.getElementById('controllerUI').classList.remove('hidden');
      } else {
        document.getElementById('targetUI').classList.remove('hidden');
      }
    }

    function sendAction(actionName) {
      socket.emit('send-command', { room: currentRoom, action: actionName });
      document.getElementById('controllerLog').innerText = "Sent: " + actionName;
    }

    socket.on('execute-command', (data) => {
      if (myRole === 'target') {
        document.getElementById('targetLog').innerText = "⚡ RECEIVED: " + data.action;
      }
    });
  </script>
</body>
</html>
